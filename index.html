        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', 'Inter', 'Helvetica Neue', 'sans-serif'],

                    colors: {

                            danger: '#ef4444'

                        'enter-slide-up': 'slideUpEnter 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'fade-in-slow': 'fadeIn 1.2s ease-out forwards',

                        'feed-item-enter': 'feedItemEnter 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards',
                        'pulse-slow': 'pulseOpacity 3s ease-in-out infinite',
                    },
                    keyframes: {
                        slideUpEnter: {
                            '0%': { opacity: '0', transform: 'translateY(40px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' }
                        },
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' }
                        },
                        successFlash: {
                            '0%': { color: '#f5f5f5', transform: 'scale(1)' },
                            '15%': { color: '#22c55e', transform: 'scale(1.08)' },
                            '50%': { color: '#22c55e', transform: 'scale(1)' },
                            '100%': { color: '#f5f5f5', transform: 'scale(1)' }
                        },
                        feedItemEnter: {
                            '0%': { opacity: '0', transform: 'translateX(-30px)' },
                            '100%': { opacity: '1', transform: 'translateX(0)' }
                        },
                        pulseOpacity: {
                            '0%, 100%': { opacity: '0.4' },
                            '50%': { opacity: '1' }
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Base Global Styling */
        html, body {
            background-color: #030303;
            color: #f5f5f5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            margin: 0;
            padding: 0;
            height: 100%;
            overflow-x: hidden;
        }

        /* Complex Geometric Grid Background */
        .architectural-grid {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-size: 50px 50px;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.04) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
            -webkit-mask-image: radial-gradient(circle at 50% 50%, black 30%, transparent 80%);
            mask-image: radial-gradient(circle at 50% 50%, black 30%, transparent 80%);
            z-index: -1;
            pointer-events: none;
        }

        /* Glassmorphic Surface Cards */
        .glass-surface {
            background: rgba(13, 13, 13, 0.85);
            backdrop-filter: blur(24px) saturate(150%);
            -webkit-backdrop-filter: blur(24px) saturate(150%);
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 
                0 25px 50px -12px rgba(0,0,0,0.8), 
                inset 0 1px 0 0 rgba(255,255,255,0.05);
        }

        /* Advanced Input Micro-Interactions */
        .premium-input {
            transition: border-color 0.3s ease, background-color 0.3s ease, box-shadow 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.05);
            background: rgba(255, 255, 255, 0.015);
            will-change: border-color, box-shadow;
        }
        .premium-input:focus {
            background: rgba(255, 255, 255, 0.03);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.02);
            outline: none;
        }
        .premium-input::placeholder {
            color: rgba(255, 255, 255, 0.2);
        }

        /* Premium Primary Action Button */
        .btn-action-primary {
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            background-color: #ffffff;
            color: #000000;
            position: relative;
            overflow: hidden;
            will-change: transform;
        }
        .btn-action-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px -10px rgba(255, 255, 255, 0.4);
        }
        .btn-action-primary:active:not(:disabled) {
            transform: translateY(1px) scale(0.98);
            box-shadow: 0 5px 15px -5px rgba(255, 255, 255, 0.3);
        }
        .btn-action-primary:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        /* Custom OS-level Scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { 
            background: rgba(255, 255, 255, 0.1); 
            border-radius: 10px; 
        }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.2); }

        /* Hardware Accelerated CSS Spinner */
        .enterprise-spinner {
            border: 2px solid rgba(0,0,0,0.1);
            border-top-color: #000000;
            border-radius: 50%;
            width: 20px; height: 20px;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { 
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Utility class to handle Single Page App state hiding */
        .state-hidden { display: none !important; }
    </style>
</head>

    <!-- ======================================================================= -->
    <!-- ENTERPRISE JAVASCRIPT ARCHITECTURE & FIREBASE INTEGRATION               -->
    <!-- ======================================================================= -->
    <script type="module">
        /**
         * @file HRRY study mods Application Logic
         * @description Comprehensive, highly verbose implementation of the Firebase SPA.
         * Features strict state management, modular utility classes, and absolute
         * real-time truth for data presentation (Zero Fake Metrics).
         */
        
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, set, onValue, onChildAdded, query, limitToLast } 
            from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // =====================================================================
        // 1. SYSTEM CONFIGURATION & CONSTANTS
        // =====================================================================
        const SYSTEM_CONFIG = {
            FIREBASE: {
                apiKey: "AIzaSy_YOUR_API_KEY_PLACEHOLDER", // Expected by SDK
                authDomain: "hrry-store-default-rtdb.firebaseapp.com",
                databaseURL: "https://hrry-store-default-rtdb.firebaseio.com/",
                projectId: "hrry-store",
            },
            STORAGE_KEY: 'hrry_enterprise_session_v2',
            DB_NODE_USERS: 'users',
            UI: {
                TOAST_DURATION_MS: 4500,
                SIMULATED_NETWORK_DELAY: 800 // To demonstrate loading state gracefully
            }
        };

        // =====================================================================
        // 2. MODULAR UTILITY CLASSES
        // =====================================================================
        
        /**
         * String formatting and anonymization utilities.
         */
        class StringFormatter {
            /**
             * Extracts the first name from a full name string.
             * @param {string} fullName 
             * @returns {string} First name
             */
            static extractFirstName(fullName) {
                if (!fullName) return "User";
                return fullName.trim().split(' ')[0];
            }

            /**
             * Anonymizes a full name for public feed display (e.g. "Rahul S.")
             * @param {string} fullName 
             * @returns {string} Anonymized name
             */
            static anonymizeForFeed(fullName) {
                const parts = fullName.trim().split(' ');
                if (parts.length > 1) {
                    return `${parts[0]} ${parts[1].charAt(0)}.`;
                }
                return parts[0];
            }
        }

        /**
         * Time and Date formatting utilities.
         */
        class TimeUtils {
            /**
             * Returns the current time in a localized short format.
             * @returns {string} (e.g. "14:35")
             */
            static getShortTime() {
                return new Date().toLocaleTimeString([], { 
                    hour: '2-digit', 
                    minute: '2-digit',
                    hour12: true
                });
            }
        }

        // =====================================================================
        // 3. CORE APPLICATION CONTROLLER
        // =====================================================================
        
        class Hrrystudy modsApplication {
            
            /**
             * Initializes the application, state, DOM cache, and boots Firebase.
             */
            constructor() {
                console.log("[HRRY System] Boot sequence initiated...");
                
                // --- State Management ---
                this.localSessionData = this.retrieveLocalSession();
                this.trueDatabaseCount = -1; // Represents the EXACT number of entries
                this.isInitialBootPhase = true;
                this.processedFeedKeys = new Set(); // To ensure unique feed items
                
                // --- Initialization Sequence ---
                this.cacheDomElements();
                this.attachPrimaryEventListeners();
                this.initializeFirebaseSubsystem();
                
                // Execute initial render pass
                this.executeRenderCycle();
            }

            /**
             * Retrieves existing session from LocalStorage securely.
             * @returns {Object|null} Session data or null
             */
            retrieveLocalSession() {
                try {
                    const rawData = localStorage.getItem(SYSTEM_CONFIG.STORAGE_KEY);
                    return rawData ? JSON.parse(rawData) : null;
                } catch (error) {
                    console.error("[HRRY System] Failed to parse local session.", error);
                    return null;
                }
            }

            /**
             * Exhaustive caching of all DOM elements to prevent querySelector overhead.
             */
            cacheDomElements() {
                // Modules (Views)
                this.domRegistrationModule = document.getElementById('module-registration');
                this.domDashboardModule = document.getElementById('module-dashboard');
                
                // Form Interactions
                this.domForm = document.getElementById('form-registration');
                this.domInputName = document.getElementById('input-fullName');
                this.domInputClass = document.getElementById('input-userClass');
                this.domInputMsg = document.getElementById('input-message');
                this.domBtnSubmit = document.getElementById('btn-submit');
                this.domTxtSubmit = document.getElementById('text-submit');
                this.domSpinner = document.getElementById('spinner-submit');
                
                // Error Display
                this.domErrorContainer = document.getElementById('display-error');
                this.domErrorText = document.getElementById('text-error');
                
                // Dashboard Elements
                this.domUserName = document.getElementById('display-userName');
                this.domLiveCounter = document.getElementById('display-liveCounter');
                this.domBtnTerminate = document.getElementById('btn-terminate-session');
                this.domActivityFeed = document.getElementById('container-activityFeed');
                this.domFeedEmptyMsg = document.getElementById('msg-feedEmpty');
                
                // Global UI
                this.domToastLayer = document.getElementById('global-toast-layer');
            }

            /**
             * Binds interaction events to DOM elements.
             */
            attachPrimaryEventListeners() {
                this.domForm.addEventListener('submit', (event) => this.processRegistrationSubmission(event));
                this.domBtnTerminate.addEventListener('click', () => this.terminateActiveSession());
            }

            /**
             * Instantiates Firebase app and Realtime Database references.
             */
            initializeFirebaseSubsystem() {
                try {
                    this.firebaseApp = initializeApp(SYSTEM_CONFIG.FIREBASE);
                    this.database = getDatabase(this.firebaseApp);
                    this.dbUsersRef = ref(this.database, SYSTEM_CONFIG.DB_NODE_USERS);
                    
                    console.log("[HRRY System] Firebase subsystem initialized.");
                    
                    // Start realtime synchronization only after successful init
                    this.startRealtimeDataSynchronization();
                } catch (error) {
                    console.error("[HRRY System] Critical failure initializing Firebase.", error);
                    this.displayFormError("System offline. Backend connection failed.");
                }
            }

            /**
             * The primary view router. Determines which module to display.
             */
            executeRenderCycle() {
                if (this.localSessionData) {
                    // State: Authenticated
                    this.domRegistrationModule.classList.add('state-hidden');
                    this.domDashboardModule.classList.remove('state-hidden');
                    
                    // Populate User Data
                    const userFirstName = StringFormatter.extractFirstName(this.localSessionData.fullName);
                    this.domUserName.textContent = userFirstName;
                } else {
                    // State: Unauthenticated
                    this.domDashboardModule.classList.add('state-hidden');
                    this.domRegistrationModule.classList.remove('state-hidden');
                    this.domForm.reset();
                    this.hideFormError();
                }
            }

            // =================================================================
            // REGISTRATION LOGIC & DATA INGESTION
            // =================================================================
            
            /**
             * Handles the complete form submission lifecycle.
             * @param {Event} event 
             */
            async processRegistrationSubmission(event) {
                event.preventDefault(); // Prevent standard HTTP post
                
                // 1. Data Extraction
                const payload = {
                    fullName: this.domInputName.value.trim(),
                    userClass: this.domInputClass.value,
                    message: this.domInputMsg.value.trim(),
                    clientTimestamp: Date.now()
                };

                // 2. Strict Validation Check
                if (!this.validatePayload(payload)) return;

                // 3. UI State: Loading
                this.toggleSubmissionState(true);
                this.hideFormError();

                try {
                    // 4. Data Transmission to Firebase
                    const newUserRef = push(this.dbUsersRef);
                    payload.recordId = newUserRef.key; // Store unique key
                    
                    await set(newUserRef, payload);

                    // 5. Successful write operations
                    this.localSessionData = payload;
                    localStorage.setItem(SYSTEM_CONFIG.STORAGE_KEY, JSON.stringify(payload));
                    
                    // 6. Artificial UX delay & Render transition
                    setTimeout(() => {
                        this.toggleSubmissionState(false);
                        this.executeRenderCycle();
                        this.dispatchGlobalToast(
                            'Authorization Successful', 
                            'Your identity has been secured on the network.', 
                            'ph-shield-check'
                        );
                    }, SYSTEM_CONFIG.UI.SIMULATED_NETWORK_DELAY);

                } catch (writeError) {
                    console.error("[HRRY System] Database write rejection.", writeError);
                    this.displayFormError("Network transmission failed. Please try again.");
                    this.toggleSubmissionState(false);
                }
            }

            /**
             * Validates extracted form data.
             * @param {Object} payload 
             * @returns {boolean} Is valid?
             */
            validatePayload(payload) {
                if (!payload.fullName || !payload.userClass || !payload.message) {
                    this.displayFormError('All fields must be strictly populated.');
                    return false;
                }
                if (payload.fullName.length < 3) {
                    this.displayFormError('Legal name must exceed 2 characters.');
                    return false;
                }
                return true;
            }

            /**
             * Mutates the submit button visually to prevent double submissions.
             * @param {boolean} isProcessing 
             */
            toggleSubmissionState(isProcessing) {
                if (isProcessing) {
                    this.domBtnSubmit.disabled = true;
                    this.domTxtSubmit.style.opacity = '0';
                    this.domSpinner.classList.remove('state-hidden');
                } else {
                    this.domBtnSubmit.disabled = false;
                    this.domTxtSubmit.style.opacity = '1';
                    this.domSpinner.classList.add('state-hidden');
                }
            }

            /**
             * Renders error message on the form.
             * @param {string} text 
             */
            displayFormError(text) {
                this.domErrorText.textContent = text;
                this.domErrorContainer.classList.remove('hidden');
            }

            /**
             * Clears form errors.
             */
            hideFormError() {
                this.domErrorContainer.classList.add('hidden');
                this.domErrorText.textContent = '';
            }

            /**
             * Destroys local session and returns to registration view.
             */
            terminateActiveSession() {
                localStorage.removeItem(SYSTEM_CONFIG.STORAGE_KEY);
                this.localSessionData = null;
                this.executeRenderCycle();
            }

            // =================================================================
            // REAL-TIME DATA SYNCHRONIZATION ENGINE
            // =================================================================
            
            /**
             * Attaches persistent Firebase listeners for live data updates.
             */
            startRealtimeDataSynchronization() {
                
                // 1. LIVE COUNTER LISTENER (ABSOLUTE TRUTH ONLY)
                // This fetches the snapshot and strictly sets the counter to snapshot.size.
                onValue(this.dbUsersRef, (snapshot) => {
                    let strictDatabaseCount = 0;
                    
                    if (snapshot.exists()) {
                        strictDatabaseCount = snapshot.size;
                    }
                    
                    // If the number actually changed and it's not the first load, trigger visual flash
                    if (this.trueDatabaseCount !== strictDatabaseCount && !this.isInitialBootPhase) {
                        this.triggerCounterVisualFeedback();
                    }
                    
                    this.trueDatabaseCount = strictDatabaseCount;
                    
                    // Format strictly (e.g. "0" becomes "00", "5" becomes "05") for aesthetics
                    // but the underlying value is 100% real.
                    const displayFormattedCount = strictDatabaseCount < 10 
                        ? `0${strictDatabaseCount}` 
                        : strictDatabaseCount.toLocaleString();
                        
                    this.domLiveCounter.textContent = displayFormattedCount;
                });

                // 2. LIVE ACTIVITY LOG LISTENER
                // Listen to only the last 6 entries to conserve memory on the client
                const recentLogsQuery = query(this.dbUsersRef, limitToLast(6));
                
                onChildAdded(recentLogsQuery, (snapshot) => {
                    const documentData = snapshot.val();
                    
                    // Ensure document exists and hasn't been rendered yet
                    if (!documentData || this.processedFeedKeys.has(documentData.recordId)) return;
                    
                    this.processedFeedKeys.add(documentData.recordId);
                    this.injectLogIntoFeed(documentData);

                    // Global Toast Notification logic (Skipped on initial load flood)
                    if (!this.isInitialBootPhase) {
                        // Suppress toast if the action was performed by the local user
                        const isSelf = this.localSessionData && documentData.recordId === this.localSessionData.recordId;
                        
                        if (!isSelf) {
                            const maskedName = StringFormatter.anonymizeForFeed(documentData.fullName);
                            this.dispatchGlobalToast(
                                'New Network Node Active', 
                                `${maskedName} has entered the global registry.`, 
                                'ph-plugs-connected'
                            );
                        }
                    }
                });

                // Conclude initial boot phase gracefully after data settles
                setTimeout(() => { 
                    this.isInitialBootPhase = false; 
                }, 2000);
            }

            /**
             * Triggers a hardware-accelerated CSS keyframe on the numeric counter.
             * This proves to the user that a real-time update just occurred.
             */
            triggerCounterVisualFeedback() {
                // DOM Reflow hack to restart CSS animation instantly
                this.domLiveCounter.classList.remove('animate-success-flash');
                void this.domLiveCounter.offsetWidth; 
                this.domLiveCounter.classList.add('animate-success-flash');
            }

            /**
             * Constructs and injects a DOM node into the activity feed.
             * @param {Object} documentData 
             */
            injectLogIntoFeed(documentData) {
                // Remove the empty state placeholder if it exists
                if (this.domFeedEmptyMsg && this.domFeedEmptyMsg.parentNode) {
                    this.domFeedEmptyMsg.remove();
                }

                const maskedName = StringFormatter.anonymizeForFeed(documentData.fullName);
                const eventTime = TimeUtils.getShortTime();

                // Construct Element
                const logElement = document.createElement('div');
                logElement.className = 'flex items-center justify-between p-3 rounded-xl bg-white/[0.015] border border-white/[0.04] animate-feed-item-enter transition-colors hover:bg-white/[0.03]';
                
                logElement.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded-full bg-black flex items-center justify-center border border-white/10 text-brand-textSub">
                            <i class="ph-fill ph-user-circle text-lg"></i>
                        </div>
                        <div class="flex flex-col">
                            <span class="text-sm text-white font-semibold leading-tight">${maskedName}</span>
                            <span class="text-[10px] text-brand-textSub font-medium tracking-wide">${documentData.userClass}</span>
                        </div>
                    </div>
                    <div class="flex flex-col items-end">
                        <span class="text-[10px] text-brand-textSub bg-black px-2 py-1 rounded-md border border-white/5 font-medium shadow-inner">${eventTime}</span>
                    </div>
                `;

                // Prepend to top of feed
                this.domActivityFeed.insertBefore(logElement, this.domActivityFeed.firstChild);

                // Memory Management: Keep max 6 nodes in DOM
                while (this.domActivityFeed.children.length > 6) {
                    this.domActivityFeed.removeChild(this.domActivityFeed.lastChild);
                }
            }

            /**
             * Generates a floating notification mimicking OS-level toasts.
             * @param {string} title 
             * @param {string} message 
             * @param {string} iconClass 
             */
            dispatchGlobalToast(title, message, iconClass) {
                const toastNode = document.createElement('div');
                toastNode.className = 'glass-surface p-4 rounded-xl flex items-center gap-3 animate-enter-slide-up pointer-events-auto border-l-[3px] border-l-white';
                
                toastNode.innerHTML = `
                    <div class="w-9 h-9 rounded-full bg-white/10 flex items-center justify-center shrink-0 border border-white/5 shadow-inner">
                        <i class="ph ${iconClass} text-white text-lg"></i>
                    </div>
                    <div>
                        <h4 class="text-sm font-bold text-white tracking-wide">${title}</h4>
                        <p class="text-[11px] font-medium text-brand-textSub mt-0.5">${message}</p>
                    </div>
                `;

                this.domToastLayer.appendChild(toastNode);

                // Self-destruct sequence
                setTimeout(() => {
                    toastNode.style.transition = 'all 0.5s cubic-bezier(0.16, 1, 0.3, 1)';
                    toastNode.style.opacity = '0';
                    toastNode.style.transform = 'translateY(-20px) scale(0.95)';
                    
                    // Remove from DOM post-animation
                    setTimeout(() => toastNode.remove(), 500);
                }, SYSTEM_CONFIG.UI.TOAST_DURATION_MS);
            }
        }

        // =====================================================================
        // APPLICATION BOOTSTRAP
        // =====================================================================
        document.addEventListener('DOMContentLoaded', () => {
            // Instantiate and expose globally for debugging purposes if needed
            window.HRRY_ENTERPRISE_INSTANCE = new Hrrystudy modsApplication();
        });

    </script>
</body>
